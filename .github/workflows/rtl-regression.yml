name: APB4 RTL Regression

on:
  push:
  pull_request:

jobs:
  basic-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y iverilog

      - name: Run self-checking RTL regression
        run: make basic
